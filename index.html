<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO & Social Sharing Meta Tags -->
    <meta name="description" content="MEDAR STUDIO — Independent creative studio crafting bold visual direction, iconic posters, album artwork, and high-impact art for brands, athletes, and culture." />
    <meta name="keywords" content="MEDAR STUDIO, visual arts, creative direction, poster design, matchday poster, album artwork, packaging, sports design, art direction, Mohamed Amine Amarir" />
    <meta name="author" content="MEDAR STUDIO" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.medarstudio.com/" />
    <meta property="og:title" content="MEDAR STUDIO | Visual Direction & High-Impact Design" />
    <meta property="og:description" content="Independent creative studio crafting bold visual direction, iconic posters, musical artwork, and defining creative art." />
    <meta property="og:image" content="/images/cover%20catharsis.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="MEDAR STUDIO | Visual Direction & High-Impact Design" />
    <meta property="twitter:description" content="Independent creative studio crafting bold visual direction, iconic posters, musical artwork, and defining creative art." />
    <meta property="twitter:image" content="/images/cover%20catharsis.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#09090b">
    
    <title>MEDAR STUDIO | Visual Direction & High-Impact Design</title>
    <link rel="stylesheet" href="./index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body>
    <!-- Option 1: Liquid Dark Satin (100% Pure CSS GPU-Accelerated Atmosphere, 0% CPU, Ultra Fast Load) -->
    <div class="liquid-satin-bg" aria-hidden="true">
      <div class="satin-orb satin-orb-cobalt"></div>
      <div class="satin-orb satin-orb-sapphire"></div>
      <div class="satin-orb satin-orb-emerald"></div>
      <div class="satin-orb satin-orb-indigo"></div>
    </div>
    
    <!-- Subtle ambient lighting & fine grid (Dark Luxury Aesthetic) -->
    <div class="ambient-glow" aria-hidden="true"></div>
    <div class="subtle-grain" aria-hidden="true"></div>

    <!-- Luxury Left-to-Right Kinetic Shapes Transition (Black & Cobalt Blue) -->
    <div id="luxuryTransitionVeil" class="luxury-transition-veil" aria-hidden="true">
      <div class="transition-shape shape-black"></div>
      <div class="transition-shape shape-navy"></div>
      <div class="transition-shape shape-cobalt">
        <div class="shape-laser-edge"></div>
      </div>
      <div class="transition-shape shape-cyan-glow"></div>
      <div class="transition-brand-badge">
        <span class="transition-brand-title">MEDAR STUDIO</span>
        <span class="transition-brand-sub">Visual Direction</span>
      </div>
    </div>

    <div id="root"></div>
    <div id="ai-assistant-container"></div>
    
    <script type="module" src="./index.js"></script>
  </body>
</html>
